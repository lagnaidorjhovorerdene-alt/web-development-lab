<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif" font-size="13">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Wireframe — Retro Closet (Лаб 5)</text>

  <!-- ===== MOBILE ===== -->
  <text x="110" y="62" text-anchor="middle" font-weight="bold">Mobile (&lt; 600px)</text>
  <rect x="20" y="75" width="180" height="460" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <rect x="30" y="83" width="160" height="12" fill="#ccc" stroke="#333"/>
  <rect x="30" y="98" width="160" height="28" fill="#ddd" stroke="#333"/>
  <text x="38" y="117">Лого</text>
  <text x="165" y="119" font-size="18">☰</text>
  <rect x="30" y="132" width="160" height="62" fill="#eee" stroke="#333"/>
  <text x="110" y="168" text-anchor="middle">Hero [ Товч ]</text>
  <text x="38" y="212" font-weight="bold">Ангилал</text>
  <rect x="30" y="218" width="48" height="34" fill="#eee" stroke="#333"/><text x="54" y="239" text-anchor="middle" font-size="9">Эмэг.</text>
  <rect x="86" y="218" width="48" height="34" fill="#eee" stroke="#333"/><text x="110" y="239" text-anchor="middle" font-size="9">Эрэг.</text>
  <rect x="142" y="218" width="48" height="34" fill="#eee" stroke="#333"/><text x="166" y="239" text-anchor="middle" font-size="9">Хүүхд</text>
  <text x="38" y="274" font-weight="bold">Эмэгтэй</text>
  <rect x="30" y="280" width="160" height="14" fill="#333"/><text x="38" y="291" font-size="9" fill="#fff">Хувцас</text>
  <rect x="30" y="298" width="160" height="30" fill="#eee" stroke="#333"/><text x="110" y="318" text-anchor="middle" font-size="11">Бараа</text>
  <rect x="30" y="332" width="160" height="30" fill="#eee" stroke="#333"/><text x="110" y="352" text-anchor="middle" font-size="11">Бараа</text>
  <rect x="30" y="368" width="160" height="14" fill="#333"/><text x="38" y="379" font-size="9" fill="#fff">Гутал</text>
  <rect x="30" y="386" width="160" height="30" fill="#eee" stroke="#333"/><text x="110" y="406" text-anchor="middle" font-size="11">Бараа (1 багана)</text>
  <rect x="30" y="422" width="160" height="30" fill="#ddd" stroke="#333"/><text x="110" y="442" text-anchor="middle" font-size="11">Цүнх ... Эрэгтэй ... Хүүхдийн</text>
  <rect x="30" y="460" width="160" height="30" fill="#eee" stroke="#333"/><text x="110" y="480" text-anchor="middle" font-size="11">Имэйл</text>
  <rect x="30" y="496" width="160" height="30" fill="#ddd" stroke="#333"/><text x="110" y="516" text-anchor="middle" font-size="11">Footer</text>

  <!-- ===== TABLET ===== -->
  <text x="400" y="62" text-anchor="middle" font-weight="bold">Tablet (600–991px)</text>
  <rect x="250" y="75" width="300" height="460" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <rect x="262" y="83" width="276" height="12" fill="#ccc" stroke="#333"/>
  <rect x="262" y="98" width="276" height="28" fill="#ddd" stroke="#333"/>
  <text x="272" y="117">Лого</text>
  <text x="508" y="119" font-size="18">☰</text>
  <rect x="262" y="132" width="276" height="70" fill="#eee" stroke="#333"/>
  <text x="400" y="172" text-anchor="middle">Hero + [ Товч ]</text>
  <text x="272" y="222" font-weight="bold">Ангилал</text>
  <rect x="262" y="228" width="86" height="38" fill="#eee" stroke="#333"/><text x="305" y="251" text-anchor="middle" font-size="11">Эмэгтэй</text>
  <rect x="357" y="228" width="86" height="38" fill="#eee" stroke="#333"/><text x="400" y="251" text-anchor="middle" font-size="11">Эрэгтэй</text>
  <rect x="452" y="228" width="86" height="38" fill="#eee" stroke="#333"/><text x="495" y="251" text-anchor="middle" font-size="11">Хүүхдийн</text>
  <text x="272" y="290" font-weight="bold">Эмэгтэй</text>
  <rect x="262" y="296" width="276" height="14" fill="#333"/><text x="270" y="307" font-size="9" fill="#fff">Хувцас</text>
  <rect x="262" y="314" width="134" height="44" fill="#eee" stroke="#333"/><text x="329" y="341" text-anchor="middle" font-size="11">Бараа 1</text>
  <rect x="404" y="314" width="134" height="44" fill="#eee" stroke="#333"/><text x="471" y="341" text-anchor="middle" font-size="11">Бараа 2</text>
  <rect x="262" y="366" width="276" height="14" fill="#333"/><text x="270" y="377" font-size="9" fill="#fff">Гутал</text>
  <rect x="262" y="384" width="134" height="44" fill="#eee" stroke="#333"/><rect x="404" y="384" width="134" height="44" fill="#eee" stroke="#333"/>
  <rect x="262" y="436" width="276" height="14" fill="#333"/><text x="270" y="447" font-size="9" fill="#fff">Цүнх</text>
  <rect x="262" y="454" width="134" height="30" fill="#eee" stroke="#333"/><rect x="404" y="454" width="134" height="30" fill="#eee" stroke="#333"/>
  <text x="400" y="502" text-anchor="middle" font-size="11">... Эрэгтэй, Хүүхдийн, Имэйл, Footer</text>

  <!-- ===== DESKTOP ===== -->
  <text x="730" y="62" text-anchor="middle" font-weight="bold">Desktop (≥ 992px)</text>
  <rect x="580" y="75" width="300" height="320" rx="6" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <rect x="590" y="82" width="280" height="10" fill="#ccc" stroke="#333"/>
  <rect x="590" y="96" width="280" height="24" fill="#ddd" stroke="#333"/>
  <text x="598" y="113">Лого</text>
  <text x="680" y="113" font-size="10">Нүүр | Эмэгтэй | Эрэгтэй | Хүүхдийн | Холбоо</text>
  <rect x="590" y="126" width="280" height="50" fill="#eee" stroke="#333"/>
  <text x="730" y="156" text-anchor="middle">Hero + [ Товч ]</text>
  <rect x="590" y="184" width="90" height="22" fill="#eee" stroke="#333"/><rect x="690" y="184" width="90" height="22" fill="#eee" stroke="#333"/><rect x="790" y="184" width="80" height="22" fill="#eee" stroke="#333"/>
  <rect x="590" y="214" width="58" height="52" fill="#ddd" stroke="#333"/><text x="619" y="244" text-anchor="middle" font-size="10">Эмэгтэй</text>
  <rect x="656" y="214" width="68" height="52" fill="#eee" stroke="#333"/><text x="690" y="244" text-anchor="middle" font-size="9">Хувцас</text>
  <rect x="730" y="214" width="68" height="52" fill="#eee" stroke="#333"/><text x="764" y="244" text-anchor="middle" font-size="9">Гутал</text>
  <rect x="804" y="214" width="66" height="52" fill="#eee" stroke="#333"/><text x="837" y="244" text-anchor="middle" font-size="9">Цүнх</text>
  <rect x="590" y="274" width="58" height="52" fill="#ddd" stroke="#333"/><text x="619" y="304" text-anchor="middle" font-size="10">Эрэгтэй</text>
  <rect x="656" y="274" width="68" height="52" fill="#eee" stroke="#333"/><rect x="730" y="274" width="68" height="52" fill="#eee" stroke="#333"/><rect x="804" y="274" width="66" height="52" fill="#eee" stroke="#333"/>
  <rect x="590" y="334" width="58" height="52" fill="#ddd" stroke="#333"/><text x="619" y="364" text-anchor="middle" font-size="10">Хүүхдийн</text>
  <rect x="656" y="334" width="68" height="52" fill="#eee" stroke="#333"/><rect x="730" y="334" width="68" height="52" fill="#eee" stroke="#333"/><rect x="804" y="334" width="66" height="52" fill="#eee" stroke="#333"/>

  <text x="730" y="420" text-anchor="middle" font-size="12">Навигаци: Mobile/Tablet → ☰ унждаг цэс</text>
  <text x="730" y="440" text-anchor="middle" font-size="12">Desktop → хэвтээ цэс</text>
  <text x="730" y="460" text-anchor="middle" font-size="12">Бараа: 1 → 2 багана → зүүн гарчиг + 3 дэд ангилал</text>
</svg>